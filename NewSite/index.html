<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox Mill Fantasy Football Club</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">

<nav class="site-nav" id="site-nav">
  <a href="index.html" class="nav-home" aria-label="Fox Mill Fantasy Football Club home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5" />
      <path d="M5.5 9.5V20a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5" />
    </svg>
  </a>
  <div class="site-nav-links" id="site-nav-links">
    <a href="manager-score-index.html">Manager Index</a>
    <a href="hall-of-champions.html">Hall of Champions</a>
    <a href="record-books.html">Record Books</a>
    <a href="power-rankings.html">Power Rankings</a>
  </div>
  <div class="nav-toggle" id="nav-toggle" role="button" tabindex="0" aria-label="Open menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>

<section class="hero">
  <div class="hero-bg"></div>
  <img class="hero-crest" src="images/crest.png" alt="Fox Mill Fantasy Football Club crest, established 2023">
  <img class="hero-players" src="images/players.png" alt="Three Fox Mill football players charging forward">
</section>

<script>
  // Mobile hamburger menu — same mechanics as the golf site's nav toggle.
  const navToggle = document.getElementById('nav-toggle');
  const navLinks  = document.getElementById('site-nav-links');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  // nav-toggle is a <div role="button">, not a real <button>, so keyboard
  // activation (Enter/Space) has to be wired up manually — a real button
  // gets this for free from the browser, a div doesn't.
  navToggle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      navToggle.click();
    }
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
