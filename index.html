<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Mill Fantasy Football Club</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="progress-nav">
    <a href="#cover" class="dot active"></a>
    <a href="#letter" class="dot"></a>
    <a href="#page2" class="dot"></a>
    <a href="#page3" class="dot"></a>
    <a href="#page4" class="dot"></a>
    <a href="#page5" class="dot"></a>
    <a href="#loser" class="dot"></a>
</div>

<section id="cover" class="panel">
    <img src="images/00-cover.png" alt="Cover">
</section>

<section id="letter" class="panel">
    <img src="images/01-letter.png" alt="Letter">
</section>

<section id="page2" class="panel">
    <img src="images/02-rankings-14-11.png" alt="Rankings 14-11">
</section>

<section id="page3" class="panel">
    <img src="images/03-rankings-10-7.png" alt="Rankings 10-7">
</section>

<section id="page4" class="panel">
    <img src="images/04-rankings-6-4.png" alt="Rankings 6-4">
</section>

<section id="page5" class="panel">
    <img src="images/05-rankings-3-1.png" alt="Rankings 3-1">
</section>

<section id="loser" class="panel">
    <img src="images/01-loser.png" alt="2023 Season Loser">
</section>

<script src="script.js"></script>

</body>
</html>
