name: Weekly stats update

on:
  # Schedule trigger removed — wasn't firing reliably, so this now runs
  # manually only. Trigger it from the Actions tab each week.
  workflow_dispatch:
    inputs:
      skip_recap:
        description: 'Skip narrative generation (only refresh stats/records — leaves current narratives untouched)'
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit stats.json back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install espn_api Pillow requests

      - name: Run ESPN pull + ingest pipeline
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python NewSite/scripts/espn_pull.py

      - name: Generate weekly recap narratives
        if: github.event.inputs.skip_recap != 'true'
        continue-on-error: true  # a failure here should never block the stats update itself
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python NewSite/scripts/generate_recap.py

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NewSite/data/stats.json NewSite/data/fastest-to-25-wins-banner.png NewSite/data/upcoming_matchups.json NewSite/data/player_lineups.json NewSite/scripts/team_mapping.json
          # Separate + fault-tolerant: if the schedule pull failed and the file never existed,
          # a missing path must not abort the whole commit of stats.json.
          git add NewSite/data/remaining_schedule.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Automated weekly stats update"
          git push
