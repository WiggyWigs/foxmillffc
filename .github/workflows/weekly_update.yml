name: Weekly stats update

on:
  schedule:
    # 8:00 AM Eastern Standard Time. GitHub Actions cron runs in UTC
    # and does NOT adjust for daylight saving automatically — this is
    # 13:00 UTC, which is 8:00 AM EST (winter) but 9:00 AM EDT
    # (summer/early season, roughly March through early November).
    # NFL season spans both — so this will run at 8 AM Eastern for
    # most of the season, and 9 AM Eastern during the early-season
    # weeks that still fall under daylight saving. If you want it to
    # always be exactly 8:00 AM local regardless of DST, this cron
    # value would need to be manually flipped twice a year (12:00 UTC
    # during EDT, 13:00 UTC during EST) — not something GitHub
    # Actions does automatically.
    - cron: '0 13 * * 2'
  workflow_dispatch:  # lets you also trigger this manually from the Actions tab
    inputs:
      skip_recap:
        description: 'Skip narrative generation (only refresh stats/records — leaves current narratives untouched)'
        type: boolean
        default: false

permissions:
  contents: write  # needed so the workflow can commit stats.json back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install espn_api Pillow requests

      - name: Run ESPN pull + ingest pipeline
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python NewSite/scripts/espn_pull.py

      - name: Generate weekly recap narratives
        if: github.event.inputs.skip_recap != 'true'
        continue-on-error: true  # a failure here should never block the stats update itself
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python NewSite/scripts/generate_recap.py

      - name: Commit and push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NewSite/data/stats.json NewSite/data/fastest-to-25-wins-banner.png NewSite/data/upcoming_matchups.json NewSite/data/player_lineups.json NewSite/scripts/team_mapping.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Automated weekly stats update"
          git push
