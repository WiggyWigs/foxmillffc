name: TEST weekly update (historical cutoff)

# Manual trigger ONLY — never runs on a schedule. Lets you pick any
# past year/week and run the full real pipeline (real ESPN data, real
# Claude API calls, using your real secrets) as if the season had only
# gotten that far — without ever touching your live site. It runs the
# TestSite/ copy of every script, and those scripts find their data via
# their own folder, so everything this writes lands in TestSite/data/.

on:
  workflow_dispatch:
    inputs:
      cutoff_year:
        description: 'Pretend the season stopped after this year'
        required: true
        type: string
      cutoff_week:
        description: 'Pretend the season stopped after this week'
        required: true
        type: string
      skip_narratives:
        description: 'Skip AI narratives (no Claude API calls; for testing page changes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test-update:
    runs-on: ubuntu-latest
    env:
      TEST_CUTOFF_YEAR: ${{ inputs.cutoff_year }}
      TEST_CUTOFF_WEEK: ${{ inputs.cutoff_week }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Sync shared inputs from live (other workflows only update NewSite)
        run: |
          cp NewSite/data/manager_roster.json TestSite/data/manager_roster.json
          cp NewSite/scripts/team_mapping.json TestSite/scripts/team_mapping.json
          cp NewSite/scripts/manager_lore.json TestSite/scripts/manager_lore.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install espn_api Pillow requests

      - name: Clear previous test data (test mode must start clean every run)
        run: |
          rm -f TestSite/data/stats.json
          rm -f TestSite/data/stats_previous_run.json
          rm -f TestSite/data/upcoming_matchups.json
          rm -f TestSite/data/player_lineups.json
          rm -f TestSite/data/remaining_schedule.json
          rm -f TestSite/scripts/espn_pull_latest.csv
          echo "Cleared stale test files — this run starts from a genuinely clean slate."

      - name: Run ESPN pull + ingest pipeline (test-cutoff mode)
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python TestSite/scripts/espn_pull.py

      # With skip_narratives checked, the API key is withheld, so no Claude
      # call can be made. The script still runs: box scores, callouts and
      # the Impact Game / Honorable Mention picks are computed without AI,
      # and each narrative logs a "ANTHROPIC_API_KEY not set" warning.
      - name: Generate weekly recap narratives (test-cutoff mode)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ !inputs.skip_narratives && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          if [ "${{ inputs.skip_narratives }}" = "true" ]; then
            echo "skip_narratives is checked: no Claude API calls this run. Narrative text will be empty."
          fi
          python TestSite/scripts/generate_recap.py

      - name: Commit and push TestSite data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only TestSite/data/ is committed. TestSite/scripts/ stays a
          # byte-for-byte twin of NewSite/scripts/ (refresh_testsite.yml
          # owns that), so run-time edits to state files there are dropped.
          git add TestSite/data/stats.json TestSite/data/upcoming_matchups.json TestSite/data/player_lineups.json TestSite/data/manager_roster.json
          git add TestSite/data/remaining_schedule.json 2>/dev/null || true
          git add TestSite/data/fastest-to-25-wins-banner.png 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "TEST update: cutoff ${{ inputs.cutoff_year }} week ${{ inputs.cutoff_week }}"
          git push
