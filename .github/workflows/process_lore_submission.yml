name: Process manager lore submission

on:
  issues:
    types: [opened]

permissions:
  contents: write        # to commit manager_lore.json
  issues: write          # to comment on and close the issue

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'lore-submission')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Process the submission
        id: process
        run: python NewSite/scripts/process_lore_submission.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Commit updated lore (only if something was added)
        if: steps.process.outputs.result == 'added'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NewSite/scripts/manager_lore.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Add manager lore from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on the issue
        uses: actions/github-script@v7
        with:
          script: |
            const message = `${{ steps.process.outputs.message }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });

      - name: Close the issue if it was successfully added
        if: steps.process.outputs.result == 'added'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
